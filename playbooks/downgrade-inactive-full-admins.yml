---
# Audit full-access org admins for inactivity and downgrade orgAccess.
#
# Listing: cisco.meraki.organizations_admins_info
# Updates: cisco.meraki.organizations_admins (state: present)
- name: Audit inactive full-access Meraki org admins and downgrade orgAccess
  hosts: localhost
  connection: local
  gather_facts: false

  # Play-level vars required for Ansible 2.20+ task-arg finalization on Meraki action plugins.
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/all.yml"

  vars:
    meraki_api_key: "{{ lookup('env', 'MERAKI_DASHBOARD_API_KEY') }}"
    meraki_organization_id: "{{ lookup('env', 'MERAKI_ORGANIZATION_ID') }}"

  pre_tasks:
    - name: Require Meraki credentials from environment
      ansible.builtin.assert:
        that:
          - meraki_api_key | length > 0
          - meraki_organization_id | length > 0
        fail_msg: >-
          Set MERAKI_DASHBOARD_API_KEY and MERAKI_ORGANIZATION_ID via
          op run --env-file=.env.op (see README), export them in your shell,
          or pass -e for each variable when running the playbook.

  tasks:
    - name: Get organization administrators
      cisco.meraki.organizations_admins_info:
        meraki_api_key: "{{ meraki_api_key }}"
        organizationId: "{{ meraki_organization_id }}"
      register: organization_admins

    - name: Compute inactive cutoff timestamp
      ansible.builtin.set_fact:
        inactive_cutoff: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((now(fmt='%s') | int) - (inactive_days_threshold * 86400)) }}"

    - name: Select organization administrators with full org access
      ansible.builtin.set_fact:
        full_organization_admins: >-
          {{
            organization_admins.meraki_response
            | selectattr('orgAccess', 'equalto', 'full')
            | list
          }}

    - name: Select inactive organization administrators
      ansible.builtin.set_fact:
        inactive_organization_admins: >-
          {{
            (
              full_organization_admins
              | selectattr('lastActive', 'none')
              | list
            )
            + (
              full_organization_admins
              | rejectattr('lastActive', 'none')
              | selectattr('lastActive', 'lt', inactive_cutoff)
              | list
            )
          }}

    - name: Report inactive administrator count
      ansible.builtin.debug:
        msg: >-
          Found {{ inactive_organization_admins | length }} inactive full-access administrator(s)
          (no lastActive or last active before {{ inactive_cutoff }}).
      when: full_organization_admins | length > 0

    - name: List inactive organization administrators
      ansible.builtin.debug:
        msg: >-
          {{ item.name }} ({{ item.email }}) —
          last active: {{ item.lastActive | default('never', true) }}
      loop: "{{ inactive_organization_admins }}"
      loop_control:
        label: "{{ item.email }}"

    - name: Show inactive administrator records
      ansible.builtin.debug:
        var: inactive_organization_admins
      when: inactive_organization_admins | length > 0

    - name: Downgrade inactive full-access administrators
      cisco.meraki.organizations_admins:
        meraki_api_key: "{{ meraki_api_key }}"
        organizationId: "{{ meraki_organization_id }}"
        adminId: "{{ item.id }}"
        name: "{{ item.name }}"
        orgAccess: "{{ inactive_admin_target_org_access }}"
        tags: "{{ item.tags | default([], true) }}"
        networks: "{{ item.networks | default([], true) }}"
        state: present
      loop: "{{ inactive_organization_admins }}"
      loop_control:
        label: "{{ item.email }}"
      register: inactive_admin_updates
      when: inactive_organization_admins | length > 0

    - name: Report administrator downgrades
      ansible.builtin.debug:
        msg: >-
          Updated {{ item.item.name }} ({{ item.item.email }}) —
          orgAccess set to {{ inactive_admin_target_org_access }}
      loop: "{{ inactive_admin_updates.results }}"
      loop_control:
        label: "{{ item.item.email }}"
      when:
        - inactive_organization_admins | length > 0
        - not item.skipped | default(false)
        - item.changed | default(false)
