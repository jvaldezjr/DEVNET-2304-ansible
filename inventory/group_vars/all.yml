---
# Non-secret playbook defaults (thresholds and target access level).
# Secrets and org ID: set MERAKI_DASHBOARD_API_KEY and MERAKI_ORGANIZATION_ID in the environment.

# Admins with null lastActive or lastActive older than this many days are inactive.
inactive_days_threshold: 90

# orgAccess applied to inactive full-access administrators.
inactive_admin_target_org_access: read-only
